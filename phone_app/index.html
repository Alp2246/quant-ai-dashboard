<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="QuantAI" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Quant AI Dashboard — yari iletken + kuantum yatirim asistani" />

  <title>Quant AI Dashboard</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: #0e1117; color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0e1117 0%, #1a1f2e 100%);
      transition: opacity .35s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #logo {
      width: 96px; height: 96px; border-radius: 22px;
      background: linear-gradient(135deg, #FF4B4B 0%, #FF8C42 50%, #FFD93D 100%);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 42px; color: #0e1117;
      box-shadow: 0 12px 40px rgba(255, 75, 75, .35);
      margin-bottom: 18px;
    }
    #title { font-size: 22px; font-weight: 700; margin: 6px 0 2px; }
    #subtitle { font-size: 13px; opacity: .65; margin-bottom: 24px; }
    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid rgba(255, 75, 75, .15);
      border-top-color: #FF4B4B;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #status {
      margin-top: 18px; font-size: 12px; opacity: .55;
      max-width: 80vw; text-align: center; line-height: 1.5;
    }

    #frame {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: 0; background: #0e1117;
    }

    #offline-banner {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
      background: #FF4B4B; color: white;
      padding: 10px 16px; text-align: center; font-size: 13px; font-weight: 600;
      transform: translateY(100%); transition: transform .3s ease;
    }
    #offline-banner.show { transform: translateY(0); }

    #install-btn {
      position: fixed; bottom: 20px; right: 20px; z-index: 1000;
      background: #FF4B4B; color: white;
      padding: 12px 18px; border: none; border-radius: 24px;
      font-weight: 700; font-size: 13px; cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 75, 75, .4);
      display: none;
    }
    #install-btn.show { display: block; }

    #error-screen {
      position: fixed; inset: 0; z-index: 9998; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      background: #0e1117; color: #fafafa; padding: 24px; text-align: center;
    }
    #error-screen.show { display: flex; }
    #error-screen h2 { color: #FF4B4B; }
    #error-screen p { opacity: .7; max-width: 500px; line-height: 1.6; }
    #error-screen button {
      margin-top: 20px; padding: 12px 24px;
      background: #FF4B4B; color: white; border: none; border-radius: 8px;
      font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="splash">
    <div id="logo">Q</div>
    <div id="title">Quant AI Dashboard</div>
    <div id="subtitle">Master Score v9 + Monte Carlo</div>
    <div class="spinner"></div>
    <div id="status">Dashboard'a baglaniliyor...</div>
  </div>

  <div id="error-screen">
    <h2>Baglanti kurulamadi</h2>
    <p>
      Dashboard'a erisilemiyor. Lutfen bilgisayardaki <strong>QuantDashboard.exe</strong>
      uygulamasinin acik oldugundan ve telefonun ayni Wi-Fi'da oldugundan emin ol.
    </p>
    <p id="error-detail" style="font-size: 12px; margin-top: 12px; opacity: .5;"></p>
    <button onclick="window.location.reload()">Tekrar Dene</button>
  </div>

  <iframe id="frame" src="about:blank" allow="clipboard-read; clipboard-write; fullscreen"></iframe>

  <div id="offline-banner">Cevrim disisin. Dashboard'a baglanilamiyor.</div>
  <button id="install-btn">Telefona yukle</button>

  <script>
    /**
     * Dashboard URL'sini belirler:
     *   - Eger PWA shell servisi 8502'de calisiyorsa, Streamlit 8501'de demektir.
     *   - Ayni host, sadece port degisir.
     */
    function resolveDashboardUrl() {
      const params = new URLSearchParams(window.location.search);
      const override = params.get('dashboard');
      if (override) return override;
      const host = window.location.hostname || 'localhost';
      const proto = window.location.protocol || 'http:';
      // Tailscale Funnel / public HTTPS: dashboard /dashboard/ altinda proxy
      if (host.endsWith('.ts.net')) {
        return `${proto}//${host}/dashboard/`;
      }
      return `${proto}//${host}:8501/`;
    }

    const DASHBOARD_URL = resolveDashboardUrl();
    const splash = document.getElementById('splash');
    const status = document.getElementById('status');
    const frame = document.getElementById('frame');
    const errorScreen = document.getElementById('error-screen');
    const errorDetail = document.getElementById('error-detail');
    const offlineBanner = document.getElementById('offline-banner');
    const installBtn = document.getElementById('install-btn');

    status.textContent = `Baglaniliyor: ${DASHBOARD_URL}`;

    let connectionTimeout = setTimeout(() => {
      showError('Zaman asimi (10 sn icinde cevap gelmedi)');
    }, 10000);

    fetch(DASHBOARD_URL, { method: 'HEAD', mode: 'no-cors', cache: 'no-store' })
      .then(() => {
        clearTimeout(connectionTimeout);
        loadDashboard();
      })
      .catch((err) => {
        clearTimeout(connectionTimeout);
        loadDashboard();
      });

    function loadDashboard() {
      frame.src = DASHBOARD_URL;
      frame.onload = () => {
        setTimeout(() => splash.classList.add('hide'), 400);
      };
      setTimeout(() => splash.classList.add('hide'), 4500);
    }

    function showError(reason) {
      errorDetail.textContent = `Detay: ${reason} — URL: ${DASHBOARD_URL}`;
      errorScreen.classList.add('show');
      splash.classList.add('hide');
    }

    window.addEventListener('online', () => offlineBanner.classList.remove('show'));
    window.addEventListener('offline', () => offlineBanner.classList.add('show'));
    if (!navigator.onLine) offlineBanner.classList.add('show');

    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      installBtn.classList.add('show');
    });
    installBtn.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      const { outcome } = await deferredInstallPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.classList.remove('show');
      }
      deferredInstallPrompt = null;
    });
    window.addEventListener('appinstalled', () => {
      installBtn.classList.remove('show');
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
          .then((reg) => console.log('SW registered:', reg.scope))
          .catch((err) => console.warn('SW failed:', err));
      });
    }

    if ('Notification' in window && Notification.permission === 'default') {
      setTimeout(() => {
        Notification.requestPermission().then((p) => console.log('Notification permission:', p));
      }, 6000);
    }
  </script>
</body>
</html>
